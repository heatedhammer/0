name: Electron Build

on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build Next.js
      run: npm run build

    - name: Build Electron app
      run: npm run electron-make

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: electron-app
        path: dist/
